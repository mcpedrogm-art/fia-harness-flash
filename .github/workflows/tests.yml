name: Tests del kit Flash

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Suite Flash (11 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar suite
        run: python -m unittest discover -s tests -v
